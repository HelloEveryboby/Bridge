plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.pybridge.python'
}

android {
    namespace 'com.pybridge.demo'
    compileSdk 34

    defaultConfig {
        applicationId "com.pybridge.demo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

python {
    version "3.11"
    buildPython "/usr/bin/python3"
    optimizeLevel 1

    srcDirs = ["src/main/python"]

    pip {
        install "numpy"
        install "requests"
    }
}
