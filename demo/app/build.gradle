plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.bridge.python'
}

android {
    namespace 'com.bridge.py.demo'
    compileSdk 35

    defaultConfig {
        applicationId "com.bridge.py.demo"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "2.0"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // 本地开发时使用 project(':runtime')
    // 发布后改用: implementation 'com.bridge:pybridge-runtime:2.0.0'
    implementation project(':runtime')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

python {
    version "3.13"
    buildPython System.getenv("PYTHON3") ?: "python3"
    optimizeLevel 1
    srcDirs = ["src/main/python"]

    // 如果你的 NDK 不在标准路径，在这里指定
    // ndkPath System.getenv("ANDROID_NDK") ?: "/path/to/ndk"

    pip {
        // 纯 Python 包可以直接用
        // 带 C 扩展的包需要 NDK 交叉编译
        // install "numpy==1.26.0"
        // install "requests"
    }
}
