// 项目级 build.gradle
// 本地开发时通过 includeBuild('..') 解析插件
// 发布后可以直接引用远程 Maven
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.5.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
        // 本地开发: 通过 settings.gradle 的 includeBuild 解析
        // 发布后: classpath "com.bridge:gradle-plugin:2.0.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
